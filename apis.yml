name: Winn.ai
description: >-
  Winn.ai is an AI-powered revenue execution platform for B2B sales teams that
  joins live sales calls to provide real-time playbook guidance, coach
  representatives on messaging and objection handling, and automate
  administrative work such as meeting note-taking, follow-up drafting, and CRM
  data entry. The product sits on top of a team's existing sales stack and
  reports outcomes including higher playbook adoption, dramatically higher CRM
  fill rates, and a large reduction in post-call admin work. Winn.ai is a
  privately held company backed by Insight Partners. WINN.AI sells API access as
  an Enterprise-plan feature ("Get conversation data and AI insights, in any
  tool") and runs a live, undocumented remote Model Context Protocol server at
  https://app.winn.ai/mcp, discovered through the RFC 9728 OAuth
  protected-resource metadata it publishes; the endpoint is gated by OAuth 2.0
  authorization code with PKCE and advertises a single read-only scope,
  sessions:read. There is no developer portal, API reference, OpenAPI document,
  SDK, CLI, webhook catalog, status page or changelog, and both pricing tiers are
  sales-gated. The company operates a Vanta-hosted trust center covering SOC 2,
  ISO 27001 and GDPR.
