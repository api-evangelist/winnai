name: Winn.ai
description: >-
  Winn.ai is an AI-powered revenue execution platform for B2B sales teams that
  joins live sales calls to provide real-time playbook guidance, coach
  representatives on messaging and objection handling, and automate
  administrative work such as meeting note-taking, follow-up drafting, and CRM
  data entry. The product sits on top of a team's existing sales stack and
  reports outcomes including higher playbook adoption, dramatically higher CRM
  fill rates, and a large reduction in post-call admin work. Winn.ai is a
  privately held company backed by Insight Partners. As of this enrichment pass
  the company exposes a product web application and a Vanta-hosted trust center
  (SOC 2, ISO 27001, GDPR) but publishes no public developer API, SDKs,
  webhooks, or specification surface.
