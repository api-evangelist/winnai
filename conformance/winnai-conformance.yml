  name: SOC 2
  conforms: true
  evidence: Listed on the Vanta-hosted trust center and repeated on the pricing page as "SOC-2".
  source: https://trust.winn.ai/
- id: iso27001
  name: ISO/IEC 27001
  conforms: true
